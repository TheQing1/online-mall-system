# 商城（frontend）和管理后台（admin）共用的站点配置，挂载为 /etc/nginx/conf.d/default.conf。
#
# 关于 add_header 的继承规则（重要）：nginx 只在「当前层级没有 add_header」时才继承上层，
# 所以任何 location 里一旦写了 add_header，server 级的四个安全头在该 location 内会全部失效。
# 下面 /assets/ 与 /admin/assets/ 两个静态资源块因此把安全头重新声明了一遍。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 后端允许的图片上传上限是 MAX_UPLOAD_SIZE=2097152（2MB，见 backend/.env.example），
    # nginx 默认 client_max_body_size 只有 1m，后台商品图/轮播图上传会先被 nginx 以 413 拒绝。
    # 这里给到 8m（约 4 倍余量，multipart 编码本身还有额外开销）。
    client_max_body_size 8m;

    # ---- gzip ----
    # 只压缩文本类资源；jpg/png/webp/woff2/zip 本身已是压缩格式，再压没有收益。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 安全响应头 ----
    # CSP 逐条说明（刻意保守但保证两个 SPA 可用）：
    #   script-src 'self'          Vite 构建产物都是同源 /assets/*.js、/admin/assets/*.js，
    #                              index.html 里没有内联 <script>，因此不需要 'unsafe-inline'。
    #   style-src  'unsafe-inline' Vue / Element Plus 运行时会把 <style> 注入 <head>，禁掉会直接白屏。
    #   img-src 'self' data: blob: 商品图走同源 /static/；Vite 会把小于 4KB 的资源内联成 data: URI；
    #                              el-upload 本地预览用 blob:。
    #   connect-src 'self'         axios baseURL 是 /api/v1，AI 客服的 fetch/SSE 也都是同源，无外部域名。
    # 需要放宽的场景：将来若引入第三方 CDN、外链字体或统计脚本，必须相应放开
    # script-src / style-src / font-src / connect-src；目前不放任何外部来源。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # 当前只在 80 端口提供 HTTP，TLS 不在本配置内终结，所以不加 Strict-Transport-Security
    # （HSTS 在 HTTP 响应上无效，且一旦被浏览器记住会造成难以回滚的强制跳转）。
    # 等 HTTPS 在这里终结后再打开下面这行：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 后端 API（含 SSE 流，禁止缓冲）
    # AI 客服的流式接口自带 X-Accel-Buffering: no，并依赖逐条 flush；
    # gzip 会把响应重新攒进压缩缓冲区，破坏 SSE 的实时性，所以这里显式关闭，
    # 代价是本 location 下的普通 JSON 响应也不再被压缩（换取流式稳定，值得）。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;
    }

    # 商品图片等静态资源
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location = /health {
        proxy_pass http://backend:8000;
    }

    # 带内容 hash 的商城构建产物（文件名形如 /assets/index-DL-2Mthq.js）：
    # 内容变则文件名变，旧文件不会被复用，因此可以安全地长期强缓存。
    # expires 1y 会生成 Expires 与 Cache-Control: max-age=31536000，这里再补
    # public, immutable（响应中会出现两个 Cache-Control 字段，按 RFC 9111 需合并解释）。
    location /assets/ {
        try_files $uri =404;
        # 只用一个 Cache-Control 头：expires 会另外生成一个 Cache-Control: max-age=...，
        # 两者并存时按 RFC 9111 需要合并解释，不如直接写全。
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 本 location 有 add_header，server 级安全头不再继承，必须重复声明
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # 管理后台是 base=/admin/ 的独立构建，产物落在 /usr/share/nginx/html/admin/assets/，
    # 文件名同样带 hash，因此单独给一份长期缓存规则（长前缀优先匹配，不会被 /admin/ 截走）。
    location /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # 管理后台 SPA
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 商城 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
