# API 与 worker 共用的环境变量。用 YAML 锚点是因为这两份配置必须完全一致——
# 复制粘贴一旦漂移（比如只在 API 上改了 Redis 地址），会变成很难查的怪问题。
x-backend-env: &backend-env
  # 运行环境。prod override 会设成 production，此时启动自检不通过就直接拒绝启动
  # （例如 JWT_SECRET_KEY 还是示例默认值），而不是静默地带着假密钥裸奔。
  # 变量名用 MALL_ENV 而不是 ENVIRONMENT：后者太常见，宿主机上随便一个同名变量
  # 都会悄悄改变容器行为。
  ENVIRONMENT: ${MALL_ENV:-development}
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  # 与 mysql 服务同源，同样只是本地 demo 的默认口令，真实部署必须覆盖。
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mall_root_123}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-online_mall}
  # 默认值仅用于本地 demo，真实部署必须换成强随机值，否则任何人都能伪造 JWT。
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  # Redis 不可用时服务会自动降级（无缓存、不限流），不会因此起不来
  REDIS_URL: redis://redis:6379/0

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly：缓存丢了可以重建，但分布式锁与限流计数最好别丢
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # 默认值仅用于本地 demo / 零配置 `docker compose up`，真实部署必须用环境变量覆盖。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mall_root_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-online_mall}
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # 用 MYSQL_PWD 传口令而不是 -p"$MYSQL_ROOT_PASSWORD"：后者会把口令写进 argv，
          # 容器里任何能执行 ps 的进程都能读到。$$ 是 compose 的转义，容器内会展开成 $。
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      UPLOAD_DIR: /app/static/products
      # 定时任务交给下面的 worker 服务，API 进程不再自己跑——
      # 这样 API 可以放心多副本，任务仍然只有一个执行者。
      RUN_BACKGROUND_TASKS: "false"
      # 信任哪些来源的 X-Forwarded-For。默认 '*' 只适合「backend 不直接对外」的场景；
      # 本地 compose 为了能开 /docs 把 8000 映射到了宿主机，所以这里是有折扣的信任。
      # prod override 会收紧成 Docker 网段。
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    volumes:
      # 商品图上传目录。用命名卷而不是 bind mount 挂 ./backend/static/products，
      # 原因是容器以 uid 1000 (appuser) 运行，而宿主机上那个目录的属主取决于
      # 「谁 clone 的仓库」：root clone 再 sudo 部署 → root:root 755 → 容器写不进去，
      # 后台传商品图直接 500，而且报错位置离原因很远（只看到一个 Permission denied）。
      # 命名卷由 Docker 用镜像里的内容初始化，**连属主一起**复制，因此没有这个问题；
      # 代价是上传的图不再直接落在仓库目录里，要看/备份得通过
      # `docker compose cp` 或 `docker run --rm -v ...:/x alpine ls /x`。
      - mall-uploads:/app/static/products
      # 向量库与 Embedding 模型缓存。刻意放在 /app/data 而不是 app/ 包内部：
      # 挂在 /app/app/models 会遮蔽 app/models/*.py，重建镜像后容器里跑的
      # 仍是 volume 中的旧代码。首次启动会自动下载模型（约 100MB）。
      - mall-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 对外调试端口（/docs、/metrics）。默认绑 0.0.0.0 是为了本地开发方便；
      # 生产用 API_BIND=127.0.0.1，只留宿主机可访问，公网扫不到 /docs。
      # 这里用变量而不是在 docker-compose.prod.yml 里重写 ports：compose 对 ports
      # 是「合并」而不是「替换」，两处都写会变成同一端口发布两次直接报错。
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    # 镜像里已有 HEALTHCHECK，这里显式覆盖一份以便在 `docker compose ps` 里直接看到状态。
    # 镜像内没有 curl，复用 /health 的 python 单行探测。
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要跑迁移 + 种子数据；如果没做模型预热，种子里的向量同步还会去下
      # 100MB 的 BGE 模型，几分钟都正常。start_period 给足，避免刚起来就被标成
      # unhealthy，连带 web 服务（depends_on: service_healthy）一起卡住。
      # 正常部署走 deploy/bootstrap.sh，预热过之后这一步只需十几秒。
      start_period: 300s

  # 定时任务 worker：只跑订单超时关单，不对外提供服务。
  # 与 backend 用同一个镜像，只是换个入口（python -m app.core.tasks）。
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.core.tasks"]
    environment:
      <<: *backend-env
    volumes:
      # 与 backend 共用向量库/模型缓存卷；worker 目前用不到，
      # 但共用可以让将来把「知识库重建」这类活也挪进来。
      - mall-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 对外的 HTTP 端口。默认直接占 80；叠加上 deploy/docker-compose.tls.yml
      # （Caddy 终结 TLS）时，把 WEB_BIND / WEB_HTTP_PORT 改成 127.0.0.1 / 8080，
      # 让 80 和 443 交给 Caddy，而 nginx 仍只在宿主机内部可达（方便直接排查问题）。
      - "${WEB_BIND:-0.0.0.0}:${WEB_HTTP_PORT:-80}:80"

  # ---- 可观测性（可选，默认不启动）----
  # 起法：docker compose --profile observability up -d
  # 默认不启是因为这两个镜像加起来几百 MB，而「看一眼商城」并不需要它们。
  # 后端自己的 /metrics 始终可用（curl localhost:8000/metrics）。
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      # 抓取目标与告警规则都在这里，改完 reload 即可（见 README）
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      # 本地演示用默认口令；真实部署必须覆盖
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  mysql-data:
  mall-data:
  mall-uploads:
  redis-data:
  prometheus-data:
  grafana-data:
