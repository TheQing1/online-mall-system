name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试与静态检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # 测试用例跑在 SQLite 上并使用假向量，因此无需 MySQL，
      # 也不会下载 100MB 的 BGE 模型；tests/test_rag_quality.py 会自动 skip。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: ruff check .

      # --cov-fail-under 让覆盖率成为门槛而不是装饰：当前 72%，留 2 个点余量。
      - name: 单元测试（含覆盖率门槛）
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: 确认应用可正常导入
        run: python -c "from app.main import app; print(app.title, app.version)"

  # 这一批用例在别处会「因为连不上 MySQL 而自动 skip」——那等于什么都没验证。
  # 所以单独开一个带 MySQL service 的 job，把 README 里「8 线程抢 3 件库存
  # 恰好成交 3 单」「5 次并发支付恰好成功 1 次」变成每次提交都能复现的证据。
  infra-integration:
    name: 真实 MySQL + Redis 集成测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: online_mall
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_root_password
      MYSQL_DATABASE: online_mall
      # 用独立的 db index，避免和别人的用途混在一起
      TEST_REDIS_URL: redis://127.0.0.1:6379/9

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 这些用例连不上 MySQL/Redis 时会 skip 而不是失败，所以必须显式断言「真的跑了」，
      # 否则配置写错（host/口令）时会得到一个绿色的假通过。
      - name: 并发防超卖 / 支付幂等 / 缓存 / 限流 / 分布式锁（skip 即视为失败）
        run: |
          set -o pipefail
          pytest -m "mysql or redis" -v | tee /tmp/infra-integration.log
          if grep -q "skipped" /tmp/infra-integration.log; then
            echo "::error::集成用例被 skip，这一步没有验证任何东西（检查 MySQL / Redis 配置）"
            exit 1
          fi

  # 可选：RAG 召回率需要下载约 100MB 的 BGE 模型（模型来自 ModelScope），
  # 放进每次 push 的流水线会让它又慢又容易因网络抖动变红，所以改成手动触发。
  # 想验证 README 里的 recall@1 = 90% 时，在 Actions 页面点 Run workflow 即可。
  rag-quality:
    name: RAG 召回率（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 真实 BGE 模型下的召回率
        run: pytest -m rag_quality -v -s

  frontend:
    name: 前端构建与 lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: 安装依赖
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: lint
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: 构建
        working-directory: ${{ matrix.app }}
        run: npm run build

  # 镜像与编排校验。
  #
  # 之前 CI 只跑 python / npm，Dockerfile 写错、compose 变量拼错、nginx 配置语法错
  # 全都发现不了 —— 要等到真正部署那一刻才炸，而那正是最不该出问题的时刻。
  # 这个 job 把「镜像能不能构建出来」和「三个 compose 文件能不能合起来解析」变成
  # 每次提交都验一遍的事。
  docker:
    name: 镜像构建与编排校验
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # 部署脚本是 sh/bash，本地开发在 Windows 上根本跑不到，只有 CI 能守住语法。
      - name: 部署脚本语法检查
        run: |
          for f in deploy/*.sh; do
            echo "== $f"
            bash -n "$f"
          done

      - name: 校验三个 compose 文件的合并结果
        # DOMAIN 必须有值：tls 层用了 ${DOMAIN:?...}，空值会让 compose 直接失败
        # ——这正是我们想要的行为，CI 这里显式给一个值来验证「给了值能过」。
        env:
          DOMAIN: mall.example.com
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
                         -f docker-compose.tls.yml config -q

      # 下面两步是「反向验证」：故意喂一份坏配置，断言它**必须**被拒绝。
      # 少了这一步，校验逻辑可能只是在一直返回 0，而 CI 永远绿。
      - name: 反向验证 · prod 层在密钥为空时必须拒绝启动
        env:
          DOMAIN: mall.example.com
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=/' .env
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml \
               config -q 2>/dev/null; then
            echo "::error::JWT_SECRET_KEY 为空时 prod 层没有拒绝"
            exit 1
          fi
          echo "已确认：空密钥会被 prod 层拒绝"

      - name: 反向验证 · check-env.sh 必须拦住示例配置
        run: |
          cp .env.example .env
          if bash deploy/check-env.sh >/dev/null 2>&1; then
            echo "::error::check-env.sh 放过了 .env.example 里的示例密钥"
            exit 1
          fi
          echo "已确认：示例配置会被 check-env.sh 拦下"

      - name: 正向验证 · 换成随机密钥后 check-env.sh 必须通过
        run: |
          sed -i "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)/" .env
          bash deploy/check-env.sh

      - uses: docker/setup-buildx-action@v3

      # 制造「本地装过依赖」的构建环境。
      #
      # 本地开发是「先 npm ci，再 docker compose build」，而 CI 默认全新检出、直接构建，
      # 所以下面这条路径 CI 本来是永远测不到的：`.dockerignore` 一旦忘了排除**嵌套**的
      # node_modules（写成 `node_modules` 而不是 `**/node_modules`，前者只匹配根目录），
      # 宿主机那 300MB 的包会被送进构建上下文，再被 `COPY frontend .` 覆盖掉容器里
      # 刚装好的 Linux 版——Vite 8 用的 rolldown 带平台原生二进制，构建当场失败。
      #
      # 这里不下载任何东西，只放一个「假 vite」：它要是被复制进镜像，构建必然失败；
      # 被正确排除的话，对构建毫无影响。
      - name: 制造「宿主机会污染构建上下文」的条件
        run: |
          mkdir -p frontend/node_modules/.bin admin/node_modules/.bin
          for app in frontend admin; do
            printf '#!/bin/sh\necho "宿主机的 node_modules 被复制进了构建上下文"\nexit 1\n' \
              > "$app/node_modules/.bin/vite"
            chmod +x "$app/node_modules/.bin/vite"
          done

      # 后端的依赖里带 sentence-transformers / torch，镜像接近 2GB；
      # 首次构建慢，之后靠 GHA 层缓存基本只重建 COPY 那几层。
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: online-mall-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=min

      - name: 构建前端与 nginx 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: online-mall-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=min

  # 端到端冒烟：真浏览器打开真页面。
  #
  # 单独一个 job 而不是塞进 frontend：它需要完整栈（MySQL + Redis + API + 两个前端），
  # 而 frontend 那个 job 只关心「能不能 lint 和构建」。
  e2e:
    name: 端到端冒烟（Playwright）
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: online_mall
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_root_password
      MYSQL_DATABASE: online_mall
      REDIS_URL: redis://127.0.0.1:6379/0
      # E2E 一轮要发几十个请求、登录 3 次：把配额抬高，否则量到的是限流器。
      # 限流本身有专门的用例（infra-integration 里跑）。
      RATE_LIMIT_API: "0"
      RATE_LIMIT_LOGIN: "1000"
      # 种子数据里同步向量索引会去下 100MB 的 BGE 模型；E2E 用不到知识库，跳过
      SEED_SKIP_VECTOR: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 准备数据库（迁移 + 种子数据）
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.core.seed

      - name: 启动后端
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/v1/products > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json

      - name: 安装前端依赖
        run: |
          npm ci --prefix frontend
          npm ci --prefix admin

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 跑生产产物而不是 dev server：dev 的依赖预构建在首次请求时可能返回
      # 504 Outdated Optimize Dep（CI 上必现，本地因为缓存预热过看不到），
      # 那会被「控制台零报错」的断言当成失败；而且真正要发布的就是这份构建产物。
      - name: 构建并启动商城与后台（preview）
        run: |
          npm run build --prefix frontend
          npm run build --prefix admin
          nohup npm run preview --prefix frontend > /tmp/frontend.log 2>&1 &
          nohup npm run preview --prefix admin > /tmp/admin.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null \
              && curl -sf http://localhost:5174/admin/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          # 起不来就当场失败：否则会拖到 E2E 步骤才报「连不上」，看不出是谁的问题
          if [ "$ready" != "1" ]; then
            echo "::error::前端没起来（前端日志见下）"
            tail -n 40 /tmp/frontend.log || true
            tail -n 40 /tmp/admin.log || true
            exit 1
          fi

      - name: 端到端测试
        working-directory: frontend
        run: |
          set -o pipefail
          # 注意：GitHub 的 run 步骤默认带 bash -e，所以「失败后再做诊断」必须写在
          # `|| status=$?` 这种 OR 列表里——否则脚本在管道失败那一刻就退出了，
          # 诊断代码根本不会执行（第一版就是这么白写了的）。
          status=0
          npm run test:e2e 2>&1 | tee /tmp/e2e.log || status=$?
          if [ "$status" -ne 0 ]; then
            # 把失败的尾巴打成注解：注解在公网可读（日志需要鉴权），
            # 这样不登录也能直接看出是哪条用例、哪一行断言挂了
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(tail -n 25 /tmp/e2e.log)
          fi
          exit "$status"

      # 失败时把三份日志打出来，否则只能看到 Playwright 的断言
      - name: 失败时输出服务日志
        if: failure()
        run: |
          echo "===== backend ====="; tail -n 60 /tmp/backend.log || true
          echo "===== frontend ====="; tail -n 30 /tmp/frontend.log || true
          echo "===== admin ====="; tail -n 30 /tmp/admin.log || true
