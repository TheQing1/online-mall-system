name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试与静态检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # 测试用例跑在 SQLite 上并使用假向量，因此无需 MySQL，
      # 也不会下载 100MB 的 BGE 模型；tests/test_rag_quality.py 会自动 skip。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: ruff check .

      # --cov-fail-under 让覆盖率成为门槛而不是装饰：当前 72%，留 2 个点余量。
      - name: 单元测试（含覆盖率门槛）
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: 确认应用可正常导入
        run: python -c "from app.main import app; print(app.title, app.version)"

  # 这一批用例在别处会「因为连不上 MySQL 而自动 skip」——那等于什么都没验证。
  # 所以单独开一个带 MySQL service 的 job，把 README 里「8 线程抢 3 件库存
  # 恰好成交 3 单」「5 次并发支付恰好成功 1 次」变成每次提交都能复现的证据。
  infra-integration:
    name: 真实 MySQL + Redis 集成测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: online_mall
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_root_password
      MYSQL_DATABASE: online_mall
      # 用独立的 db index，避免和别人的用途混在一起
      TEST_REDIS_URL: redis://127.0.0.1:6379/9

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 这些用例连不上 MySQL/Redis 时会 skip 而不是失败，所以必须显式断言「真的跑了」，
      # 否则配置写错（host/口令）时会得到一个绿色的假通过。
      - name: 并发防超卖 / 支付幂等 / 缓存 / 限流 / 分布式锁（skip 即视为失败）
        run: |
          set -o pipefail
          pytest -m "mysql or redis" -v | tee /tmp/infra-integration.log
          if grep -q "skipped" /tmp/infra-integration.log; then
            echo "::error::集成用例被 skip，这一步没有验证任何东西（检查 MySQL / Redis 配置）"
            exit 1
          fi

  # 可选：RAG 召回率需要下载约 100MB 的 BGE 模型（模型来自 ModelScope），
  # 放进每次 push 的流水线会让它又慢又容易因网络抖动变红，所以改成手动触发。
  # 想验证 README 里的 recall@1 = 90% 时，在 Actions 页面点 Run workflow 即可。
  rag-quality:
    name: RAG 召回率（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 真实 BGE 模型下的召回率
        run: pytest -m rag_quality -v -s

  frontend:
    name: 前端构建与 lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: 安装依赖
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: lint
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: 构建
        working-directory: ${{ matrix.app }}
        run: npm run build
