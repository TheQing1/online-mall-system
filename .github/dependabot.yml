# 依赖升级自动化。
#
# 为什么需要：`scripts/security-audit.sh` 只能**发现**依赖里的已知漏洞，
# 不能替你升级。没有 dependabot 的话，漏洞清单会一直原地不动——
# 发现了问题但没人处理，等于没发现。
#
# 策略上刻意保守：
#   - 安全更新单独成组，优先合入；
#   - LangChain 生态（langchain / langchain-core / langchain-openai /
#     langchain-text-splitters）在 requirements.txt 里是强耦合钉死的，
#     分组更新且限制频率，避免单包升级造成版本不兼容；
#   - GitHub Actions 也纳入检查（action 本身也有版本漏洞）。
version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    # --- 必须锁住的东西 ---
    #
    # 这些不是「懒」，是**实测确认会坏**。dependabot 默认会为它们每周开 PR，
    # 一条长期开着、没人合、也没人明确否决的 PR，只会训练大家忽略 PR 列表。
    # 与其每次手动关掉，不如在这里写清楚为什么不能升。
    #
    # 解除条件：单独排期做框架大版本升级，并完整重跑 129 个后端用例 + 13 个 e2e。
    ignore:
      # 实测：装 starlette 1.x 后 FastAPI 0.115 直接起不来——
      #   TypeError: Router.__init__() got an unexpected keyword argument 'on_startup'
      # （starlette 1.0 移除了 on_startup 参数，而 FastAPI 0.115 还在用它）
      # starlette 与 fastapi/pydantic/sqlalchemy 必须**整组一起升**，不能单独动。
      - dependency-name: "starlette"
      - dependency-name: "python-multipart"
      # 同一条升级链上的框架核心：单独升任何一个都会造成版本矩阵自相矛盾。
      # 这五项要升就一起升，属于「一次独立的迁移工程」，不适合自动 PR。
      #
      # 实测过的反例：fastapi 0.115.0 → 0.115.14（**只是 patch**）看着很安全，
      # 但 0.115.14 要求 starlette>=0.40.0，而本仓库钉着 starlette==0.38.6，
      # 于是 `pip install` 直接 ResolutionImpossible：
      #   Cannot install ... and starlette==0.38.6 because these package versions
      #   have conflicting dependencies.
      # 所以 fastapi 连 patch 都要挡——它与 starlette 的版本下限是绑死的。
      - dependency-name: "fastapi"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "alembic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pydantic-settings"
      # LangChain 生态在 requirements.txt 里是强耦合钉死的（核心已锁 0.3.x）。
      # 单升 langchain-text-splitters 到 1.x 会与 langchain-core 0.3.40 冲突。
      # 整组迁移到 1.x 是另一件事，需要重新验证检索/重排/流式生成。
      - dependency-name: "langchain-text-splitters"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain-openai"
        update-types: ["version-update:semver-major"]
      # 实测：langchain-huggingface 1.2.3 与锁定的 langchain-core 0.3.40
      #   → ResolutionImpossible（安装阶段直接冲突）。
      # 正确的升级路径是 0.1.2 → 0.3.1，但那会连带把 langchain-core 拉到
      # 0.3.86 并引入 httpx2 / xxhash / zstandard 等一串新依赖——
      # 这属于「LangChain 生态整组迁移」，是一次独立工程，不是自动 PR 能覆盖的。
      - dependency-name: "langchain-huggingface"
        update-types: ["version-update:semver-major"]
    groups:
      # 安全补丁优先，单独一个 PR，方便快速 review 合并
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # LangChain 生态必须整组升：单独升一个会破坏版本兼容
      # （requirements.txt 里钉死 langchain-core==0.3.40 就是这个原因）
      langchain:
        patterns:
          - "langchain*"
          - "langsmith"
      # 其余非安全更新合并成一个 PR，减少噪音
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      # Vue / Vite 生态一起升，避免 plugin 与 core 版本错配
      vue-vite:
        patterns:
          - "vue*"
          - "@vitejs/*"
          - "vite*"
          - "vitest*"
      test-tooling:
        patterns:
          - "@playwright/*"
          - "@vue/test-utils"
          - "jsdom"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - admin
    groups:
      vue-vite:
        patterns:
          - "vue*"
          - "@vitejs/*"
          - "vite*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci

  # Docker 基础镜像（python:3.11-slim / node / nginx / mysql / redis）
  # 也有过期风险，但自动开 PR 噪音较大，改成季度检查。
  - package-ecosystem: docker
    directories:
      - /backend
      - /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    ignore:
      # 基础镜像的**大版本**跳变不应自动 PR：
      # python 3.11 → 3.15 是四次大版本，CPython 每个大版本都可能移除/废弃 API，
      # 而 torch / chromadb / sentence-transformers 这些重依赖未必有对应 wheel。
      # node 同理（当前与 Vite 8 / Playwright 的版本矩阵是配套验证过的）。
      # 只接受同一个大版本内的补丁升级（3.11.x → 3.11.y）。
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
